$kind: http-request
url: "{{baseUrl}}/api/v1/applications/{{sampleAppId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      if (body.data && body.data.version) {
          pm.collectionVariables.set('appVersion', body.data.version);
      }
    language: text/javascript
order: 2000
