$kind: http-request
description: 按种子数据修改用户名/密码。锁定与限流返回 429。
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "username": "ADMIN", "password": "Admin@2026rbac" }'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      if (body.data && body.data.token) {
          pm.collectionVariables.set('accessToken', body.data.token);
          pm.collectionVariables.set('userId', body.data.userId);
          console.log('已保存 accessToken，restricted=' + body.data.restricted);
      }
    language: text/javascript
order: 1000
